name: Local app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_bridge.py'
      - run: npm run build:local
      - run: node scripts/test-translation-cancellation.mjs
